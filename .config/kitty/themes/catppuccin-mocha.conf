# Catppuccin Mocha color scheme for kitty terminal emulator
# https://github.com/catppuccin/kitty

foreground #cdd6f4
background #1e1e2e

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Cursor
cursor #f5e0dc
cursor_text_color #1e1e2e

# Selection highlight
selection_foreground none
selection_background #45475a

# The color for highlighting URLs on mouse-over
url_color #f5e0dc

# Window borders
active_border_color #b4befe
inactive_border_color #6c7086
bell_border_color #f9e2af

# Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_font_style bold
tab_bar_background #11111b

# Title bar
macos_titlebar_color #1e1e2e
